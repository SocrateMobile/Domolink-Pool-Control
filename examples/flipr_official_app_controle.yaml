type: custom:button-card
show_name: false
show_icon: false
show_state: false
styles:
  card:
    - padding: 0px
    - margin: 0px
    - border-radius: 28px
    - overflow: hidden
    - background: "#eef4f8"
    - box-shadow: "0 10px 30px rgba(0,0,0,0.3)"
    - width: 100%
    - height: 100%
  custom_fields:
    app_container:
      - width: 100%
      - height: 100%
      - padding: 0px

custom_fields:
  app_container: |
    [[[
      // Détection automatique du préfixe des entités Flipr (ex: "sensor.jardin_flipr_piscine")
      const ph_entity_name = Object.keys(states).find(e => e.startsWith('sensor.') && (e.includes('domolink') || e.includes('flipr') || e.includes('pool') || e.includes('piscine')) && e.endsWith('_ph'));
      const prefix = ph_entity_name ? ph_entity_name.replace('_ph', '') : (Object.keys(states).find(e => e.startsWith('sensor.domolink_pool')) ? 'sensor.domolink_pool_piscine' : 'sensor.flipr');
      let pool_name = 'Piscine';
      if (ph_entity_name && states[ph_entity_name]?.attributes?.friendly_name) {
        pool_name = states[ph_entity_name].attributes.friendly_name.replace(/\s*(pH|Température.*|Temperature.*|Redox.*|Chlore.*|Batterie.*)$/i, '').trim() || 'Piscine';
      }

      const air_temp = states[`${prefix}_temperature_de_l_air`] ? states[`${prefix}_temperature_de_l_air`].state : '36';
      const uv_index = states[`${prefix}_indice_uv`] ? states[`${prefix}_indice_uv`].state : '0';
      const water_temp = states[`${prefix}_temperature_de_l_eau`] ? states[`${prefix}_temperature_de_l_eau`].state : '29';
      const ph_val = states[`${prefix}_ph`] ? states[`${prefix}_ph`].state : '7.1';
      const redox_val = states[`${prefix}_redox`] ? states[`${prefix}_redox`].state : (states[`${prefix}_potentiel_redox`] ? states[`${prefix}_potentiel_redox`].state : '545');
      const ph_num = parseFloat(ph_val);
      let ph_status = "Idéal";
      let ph_icon = "👍";
      if (isNaN(ph_num)) {
        ph_status = "En attente";
        ph_icon = "⏳";
      } else if (ph_num >= 7.0 && ph_num <= 7.4) {
        ph_status = "Idéal";
        ph_icon = "👍";
      } else if (ph_num > 7.4 && ph_num <= 7.7) {
        ph_status = "Élevé";
        ph_icon = "⚠️";
      } else if (ph_num > 7.7) {
        ph_status = "Trop haut";
        ph_icon = "🚨";
      } else if (ph_num >= 6.8 && ph_num < 7.0) {
        ph_status = "Un peu bas";
        ph_icon = "⚠️";
      } else {
        ph_status = "Trop bas";
        ph_icon = "🚨";
      }

      const rx_num = parseFloat(redox_val);
      let cl_status = "Idéal";
      let cl_icon = "👍";
      if (isNaN(rx_num)) {
        cl_status = "En attente";
        cl_icon = "⏳";
      } else if (rx_num >= 650 && rx_num <= 750) {
        cl_status = "Idéal";
        cl_icon = "👍";
      } else if (rx_num > 750 && rx_num <= 800) {
        cl_status = "Élevé";
        cl_icon = "⚠️";
      } else if (rx_num > 800) {
        cl_status = "Surdosage";
        cl_icon = "🚨";
      } else if (rx_num >= 580 && rx_num < 650) {
        cl_status = "Faible";
        cl_icon = "⚠️";
      } else {
        cl_status = "Insuffisant";
        cl_icon = "🚨";
      }
      const last_measure = states[`${prefix}_derniere_mesure`] ? states[`${prefix}_derniere_mesure`].state : 'mar. 04/08 01:20';
      
      const pump_entity = Object.keys(states).find(e => e.startsWith('switch.') && (e.includes('pompe_filtration') || e.includes('pump_filtration')));
      const pump_state = (pump_entity && states[pump_entity]) ? states[pump_entity].state : 'off';
      const pump_bg = (pump_state === 'on') ? '#22c55e' : '#f1f5f9';
      const pump_color = (pump_state === 'on') ? 'white' : '#94a3b8';
      const pump_shadow = (pump_state === 'on') ? 'box-shadow: 0 2px 10px rgba(34,197,94,0.4);' : '';

      const mode_entity = Object.keys(states).find(e => e.startsWith('select.') && (e.includes('mode_filtration') || e.includes('flipr')));
      const hub_mode = (mode_entity && states[mode_entity]) ? states[mode_entity].state : 'auto';
      const auto_bg = (hub_mode === 'auto') ? '#3b82f6' : '#f1f5f9';
      const auto_color = (hub_mode === 'auto') ? 'white' : '#94a3b8';
      const plan_bg = (hub_mode === 'planning') ? '#3b82f6' : '#f1f5f9';
      const plan_color = (hub_mode === 'planning') ? 'white' : '#94a3b8';
      const man_bg = (hub_mode === 'manual') ? '#3b82f6' : '#f1f5f9';
      const man_color = (hub_mode === 'manual') ? 'white' : '#94a3b8';

      return `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; background: #eef4f8; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
          
          <!-- EN-TÊTE & SELECTIONS -->
          <div style="padding: 16px 18px 8px 18px; text-align: center;">
            <div style="font-size: 15px; font-weight: 500; color: #1e293b; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
              ${pool_name} <span style="font-size: 10px; color: #64748b;">▼</span>
            </div>
            
            <div style="display: flex; background: #94a3b8; border-radius: 14px; padding: 2px; width: 100%; box-sizing: border-box;">
              <!-- Analyse Inactif -->
              <div style="flex: 1; padding: 8px 12px; color: white; border-radius: 12px; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span style="font-size: 16px;">💧</span> Analyse
              </div>
              <!-- Contrôle Actif -->
              <div style="flex: 1; padding: 8px 12px; background: #1e293b; color: white; border-radius: 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
                <span style="font-size: 16px;">🔲</span> Contrôle
              </div>
            </div>
          </div>

          <!-- SECTION HAUTE -->
          <div style="padding: 12px 18px 14px 18px; display: flex; flex-direction: column; gap: 14px;">
            
            <!-- AIR & METEO -->
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: baseline; gap: 6px;">
                <span style="font-size: 18px; color: #64748b; font-weight: 400;">air</span>
                <span style="font-size: 42px; font-weight: 700; color: #1e293b; letter-spacing: -1px;">${air_temp}°C</span>
                <span style="color: #0284c7; font-weight: 700; font-size: 16px;">↘</span>
              </div>
              
              <div style="height: 30px; width: 1px; background: #cbd5e1;"></div>

              <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
                <div style="font-size: 16px; color: #475569;">☀️ <span style="font-size: 12px; color: #94a3b8; font-weight: 800;">&gt;</span> ☁️</div>
                <div style="border: 1.5px solid #64748b; border-radius: 12px; padding: 2px 10px; font-size: 11px; font-weight: 700; color: #334155;">
                  UV ${uv_index}
                </div>
              </div>
            </div>

            <!-- POMPE A FILTRATION -->
            <div style="background: white; border-radius: 16px; padding: 16px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
              <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
                <div style="font-size: 28px; line-height: 1;">🚰</div>
                <div style="font-size: 11px; font-weight: 500; color: #1e293b;">Pompe à filtration</div>
              </div>
              <div style="display: flex; gap: 8px;">
                <div style="background: ${auto_bg}; color: ${auto_color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;" title="Mode Automatique">⚡ᴬ</div>
                <div style="background: ${plan_bg}; color: ${plan_color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px;" title="Planning">⏱️</div>
                <div style="background: ${pump_bg}; color: ${pump_color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; ${pump_shadow}" title="Marche/Arrêt">⏻</div>
                <div style="background: ${man_bg}; color: ${man_color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px;" title="Mode Manuel">✋</div>
              </div>
            </div>

            <!-- HISTORIQUE pH -->
            <div style="background: white; border-radius: 16px; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
              <div style="font-size: 11px; color: #475569; font-weight: 600; margin-bottom: 8px;">Taux de pH sur les 7 derniers jours</div>
              <div style="display: flex; justify-content: space-between; gap: 4px; text-align: center;">
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">7.81 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">29/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">7.79 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">30/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">7.84 ↗</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">31/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">7.87 ↗</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">01/08</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">7.86 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">02/08</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">6.82 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">03/08</div></div>
                <div style="flex: 1;"><div style="background: #0284c7; color: white; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 700;">N/A</div><div style="font-size: 9px; color: #94a3b8; margin-top: 3px;">04/08</div></div>
              </div>
            </div>

            <!-- HISTORIQUE REDOX -->
            <div style="background: white; border-radius: 16px; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
              <div style="font-size: 11px; color: #475569; font-weight: 600; margin-bottom: 8px;">Taux de Redox(mV) sur les 7 derniers jours</div>
              <div style="display: flex; justify-content: space-between; gap: 4px; text-align: center;">
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">628 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">29/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">577 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">30/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">533 ↗</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">31/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">537 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">01/08</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">516 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">02/08</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; font-size: 10px; color: #94a3b8;">508 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">03/08</div></div>
                <div style="flex: 1;"><div style="background: #0284c7; color: white; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 700;">N/A</div><div style="font-size: 9px; color: #94a3b8; margin-top: 3px;">04/08</div></div>
              </div>
            </div>

            <!-- HISTORIQUE EAU -->
            <div style="background: white; border-radius: 16px; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
              <div style="font-size: 11px; color: #475569; font-weight: 600; margin-bottom: 8px;">Température de l'eau sur les 7 derniers jours</div>
              <div style="display: flex; justify-content: space-between; gap: 4px; text-align: center;">
                <div style="flex: 1;"><div style="border: 1px solid #0284c7; color: #0284c7; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 600;">29 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">29/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #0284c7; color: #0284c7; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 600;">29 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">30/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #0284c7; color: #0284c7; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 600;">28 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">31/07</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #0284c7; color: #0284c7; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 600;">28 ↗</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">01/08</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #0284c7; color: #0284c7; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 600;">29 ↗</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">02/08</div></div>
                <div style="flex: 1;"><div style="border: 1px solid #0284c7; color: #0284c7; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 600;">29 ↘</div><div style="font-size: 9px; color: #cbd5e1; margin-top: 3px;">03/08</div></div>
                <div style="flex: 1;"><div style="background: #0284c7; color: white; border-radius: 6px; padding: 2px; font-size: 10px; font-weight: 700;">N/A</div><div style="font-size: 9px; color: #94a3b8; margin-top: 3px;">04/08</div></div>
              </div>
            </div>

            <!-- PREVISION METEO 4 JOURS -->
            <div style="background: white; border-radius: 16px; padding: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 18px;">☀️</div>
                <div style="font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px;">25 | 36°</div>
              </div>
              <div style="height: 30px; width: 1px; background: #e2e8f0;"></div>
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 18px;">☀️</div>
                <div style="font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px;">21 | 34°</div>
              </div>
              <div style="height: 30px; width: 1px; background: #e2e8f0;"></div>
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 18px;">☀️</div>
                <div style="font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px;">20 | 38°</div>
              </div>
              <div style="height: 30px; width: 1px; background: #e2e8f0;"></div>
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 18px;">☀️</div>
                <div style="font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px;">22 | 39°</div>
              </div>
            </div>

          </div>

          <!-- SECTION BASSE DEGRADÉ SIMPLIFIÉE (Sans jauges, juste texte) -->
          <div style="background: linear-gradient(170deg, #10b981 0%, #0284c7 40%, #1e3a8a 100%); border-top-left-radius: 40px; border-top-right-radius: 40px; padding: 24px 20px 16px 20px; color: white; display: flex; flex-direction: column; gap: 20px; flex-grow: 1; justify-content: space-between;">
            
            <div style="display: flex; justify-content: space-around; align-items: flex-end; padding-top: 10px; padding-bottom: 10px;">
              
              <!-- INFO EAU -->
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 15px; font-weight: 400; opacity: 0.9; margin-bottom: 4px;">eau</div>
                <div style="font-size: 32px; font-weight: 600; letter-spacing: -1px;">${water_temp}°C</div>
              </div>

              <!-- INFO pH -->
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 15px; font-weight: 400; opacity: 0.9; margin-bottom: 4px;">pH</div>
                <div style="font-size: 26px; font-weight: 600;">${ph_val}</div>
                <div style="font-size: 12px; font-weight: 600; opacity: 0.95;">${ph_icon} ${ph_status}</div>
              </div>

              <!-- INFO CHLORE -->
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 15px; font-weight: 400; opacity: 0.9; margin-bottom: 4px;">Chlore</div>
                <div style="font-size: 20px; font-weight: 600;">${cl_icon} ${cl_status}</div>
              </div>
            </div>

            <!-- BANNIERES BOTTOM -->
            <div style="background: rgba(0,0,0,0.3); color: white; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; margin-top: 4px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="border: 2px solid white; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px;">!</span> 
                Mesure ancienne
              </div>
              <div style="text-decoration: underline; opacity: 0.9;">En savoir plus</div>
            </div>

            <!-- PIED DE PAGE -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 10px 0 10px; font-size: 11px; font-weight: 500;">
              <div style="text-align: center;">
                <div style="font-size: 20px; margin-bottom: 2px; opacity: 0.9;">〰️</div>
                <div style="opacity: 0.9;">Menu</div>
              </div>
              <div style="text-align: center; border: 1.5px solid white; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                🦈
              </div>
              <div style="text-align: center;">
                <div style="font-size: 20px; margin-bottom: 2px; opacity: 0.9;">🪣</div>
                <div style="opacity: 0.9;">Flipr Store</div>
              </div>
            </div>

          </div>

        </div>
      `;
    ]]]
